#Limb Loss System Settings
[limb_system]
	#Chance multiplier for players WITHOUT a Devil Fruit.
	#0.5 = 50% less likely to lose limb compared to DF users.
	#1.0 = same chance as DF users.
	#Range: 0.0 ~ 1.0
	nonDevilFruitChanceMultiplier = 0.5
	#Cooldown in ticks after losing/healing a limb before it can be severed again.
	#24000 ticks = 20 minutes. Set to 0 to disable cooldown.
	#Range: 0 ~ 72000
	severCooldownTicks = 24000
	#Time in ticks for Logia users to regenerate their limb.
	#200 ticks = 10 seconds.
	#Range: 20 ~ 12000
	logiaRegenTicks = 200
	#Minimum damage required to have any chance of severing a limb.
	#Damage below this amount will never trigger limb loss.
	#Range: 1 ~ 100
	minDamageThreshold = 50
	#Enable or disable the entire limb loss system.
	#When disabled, players cannot lose limbs and medic bag healing is disabled.
	enabled = true
	#Multiplier for limb sever chance.
	#Base chance = damage taken (e.g., 25 damage = 25% chance).
	#1.0 = normal, 0.5 = half chance, 2.0 = double chance.
	#Range: 0.0 ~ 5.0
	severChanceMultiplier = 1.0

