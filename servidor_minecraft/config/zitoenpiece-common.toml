#Haki Clash System Settings
#When two entities with Busoshoku Haki active hit each other within the window,
#a dramatic clash occurs where they lock in combat.
[clash_system]
	#How long a clash lasts in ticks.
	#160 ticks = 8 seconds.
	#Range: 20 ~ 400
	durationTicks = 160
	#Intensity of camera shake during clash.
	#0 = disabled, 0.15 = light shake, 0.5 = heavy shake.
	#Range: 0.0 ~ 1.0
	cameraShakeIntensity = 0.15
	#Time window in ticks for mutual hits to trigger a clash.
	#Both entities must hit each other within this window.
	#5 ticks = 0.25 seconds. Lower = harder to trigger.
	#Range: 1 ~ 40
	windowTicks = 5
	#Duration of dizzy effect applied to loser in ticks.
	#40 ticks = 2 seconds.
	#Range: 0 ~ 200
	dizzyDuration = 40
	#Percent chance (0-100) for a clash to trigger when conditions are met.
	#100 = always triggers, 50 = 50% chance, 0 = never triggers.
	#Range: 0 ~ 100
	triggerChance = 20
	#Cooldown in ticks before an entity can clash again.
	#600 ticks = 30 seconds.
	#Range: 0 ~ 1200
	cooldownTicks = 600
	#Percentage of max overuse recharged for clash loser.
	#0.05 = loser gets 5% of their max overuse restored.
	#Range: 0.0 ~ 1.0
	loserOveruseRecharge = 0.05
	#Percentage of max overuse recharged for clash winner.
	#0.15 = winner gets 15% of their max overuse restored.
	#Range: 0.0 ~ 1.0
	winnerOveruseRecharge = 0.15
	#Enable or disable the Haki Clash system entirely.
	enabled = true
	#Handicap multiplier for boss/mob haki exp in clash calculations.
	#0.75 = bosses use 75% of their haki exp when determining winner.
	#Lower = easier for players to win against bosses.
	#Range: 0.1 ~ 1.0
	bossHakiHandicap = 0.75

