#Haki System Settings
#Config for the Haki bar (overuse).
[haki_system]
	#Hard ceiling on a player's maximum Haki Overuse (the haki bar).
	#Overuse normally scales with total Haki exp (totalExp x 140).
	#This caps that maximum to a flat value regardless of exp.
	#-1 = no limit (default behaviour).
	#Range: > -1
	overuseLimit = -1

#Yonko System Requirements
#Hard gates that must ALL be met to qualify for Yonko.
#Fraud trait skips the doriki requirement.
[yonko_requirements]
	#Maximum real-time days a Yonko can be offline before automatic demotion.
	#0 = disabled (no inactivity demotion).
	#Range: 0 ~ 90
	maxOfflineDays = 5
	#Minimum crew members (excluding captain) for Yonko eligibility.
	#Range: 1 ~ 100
	minimumCrewMembers = 4
	#Number of strikes before a Yonko is demoted.
	#Range: 1 ~ 20
	maxStrikes = 5
	#Cooldown in ticks before a candidate or Yonko can be involved in another Yonko duel.
	#360000 = 5 in-game hours.
	#Range: 1200 ~ 1728000
	duelCooldownTicks = 360000
	#Minimum territories owned by the crew for Yonko eligibility.
	#Range: 0 ~ 10
	minimumTerritories = 1
	#Minimum doriki for Yonko eligibility. Fraud trait skips this.
	#Range: 0 ~ 1000000
	minimumDoriki = 8000
	#Minimum bounty (in Berries) for Yonko eligibility.
	#Range: 1000000 ~ 9223372036854775807
	minimumBounty = 1000000000
	#Seconds a Yonko has to accept a challenge before it expires.
	#1800 = 30 minutes.
	#Range: 60 ~ 7200
	duelAcceptTimeSeconds = 1800
	#Maximum territories a Yonko crew can own.
	#Range: 1 ~ 10
	maxTerritories = 2

