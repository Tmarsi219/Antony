
#Haki ability requirements.
#
#Each ability has substat thresholds (e.g. 'buso_hardness:50') and a token cost for each step.
#Edit the numbers to change what players need to unlock or upgrade an ability.
#
#Valid substat IDs:
#  buso_endurance, buso_power, buso_hardness
#  ken_awareness, ken_sense, ken_focus
#  hao_intensity, hao_dominance, hao_control
#
#An empty list ([]) means no substat requirement for that step.
#Restart the server after editing this file.
[haki_requirements]

	#Armament Haki abilities (Busoshoku).
	[haki_requirements.armament]

		[haki_requirements.armament.buso_emission]
			#Substats required to upgrade to Mastered.
			t3_substats = ["buso_power:55", "buso_hardness:45", "buso_endurance:35"]
			#Substats required to upgrade to Advanced.
			t2_substats = ["buso_power:30", "buso_hardness:25"]
			#Tokens to unlock this ability.
			#Range: 0 ~ 100
			unlock_token_cost = 3
			#Tokens to upgrade to Advanced.
			#Range: 0 ~ 100
			t1_to_t2_token_cost = 4
			#Substats required to unlock this ability.
			unlock_substats = ["buso_endurance:55", "buso_power:80"]
