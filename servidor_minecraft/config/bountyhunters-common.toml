#HOW TO ADD CUSTOM ABILITIES:
#  Abilities use full Java class names (WrapperGoal classes).
#  Format: package.path.to.AbilityNameWrapperGoal
#
#IMPORTANT RULES:
#  1. Class names are CASE-SENSITIVE and use PascalCase
#  2. Do NOT use underscores (wrong: extra_hachis, correct: ExtraHachis)
#  3. Use the full package path
