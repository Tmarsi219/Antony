	#Exponential Growth Settings
	#When enabled, bounty hunters will scale their stats based on the highest doriki in the world.
	#This works similar to how Vice Admirals and Notorious Pirates scale in Mine Mine No Mi.
	#
	#Formula: finalStat = baseStat * (1 + (worldDoriki / minDorikiForScaling) ^ growthRate * growthBase)
	#Example with defaults: If world highest doriki is 10000 and minDoriki is 5000:
	#  multiplier = 1 + (10000/5000)^0.5 * 0.1 = 1 + 1.414 * 0.1 = 1.14 (14% boost)
	[bountyhunters.exponentialGrowth]
		#Enable exponential growth based on world's highest doriki.
		#When enabled, bounty hunters will become stronger as players progress.
		enableExponentialGrowth = true
		#Exponent for the growth curve.
		#0.5 = square root (slower scaling at high doriki)
		#1.0 = linear scaling
		#2.0 = quadratic (very aggressive scaling)
		#Range: 0.1 ~ 2.0
		exponentialGrowthRate = 0.5
		#Minimum world doriki before scaling kicks in.
		#Below this value, hunters use base stats only.
		#Range: 1000.0 ~ 100000.0
		minDorikiForScaling = 5000.0
		#Base multiplier for exponential growth.
		#Higher values = more aggressive scaling.
		#0.1 = 10% boost per unit of scaled doriki
		#Range: 0.01 ~ 1.0
		exponentialGrowthBase = 0.1
		#Apply exponential scaling to health
		scaleHealth = true
		#Maximum stat multiplier cap.
		#Prevents hunters from becoming too powerful.
		#2.0 = stats can at most double
		#Range: 1.5 ~ 10.0
		maxStatMultiplier = 3.0
		#Apply exponential scaling to hunter's doriki
		scaleDoriki = true
		#Apply exponential scaling to attack damage
		scaleAttack = true
		#Apply exponential scaling to armor
		scaleArmor = true

